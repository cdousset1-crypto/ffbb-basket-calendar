name: Update calendar

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        run: python ffbb_sync.py

      - name: Commit calendar
        run: |
          git config user.name "ffbb-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basket.ics
          git diff --cached --quiet || git commit -m "Update basket calendar"
          git push

  pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp basket.ics _site/basket.ics
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
          <meta charset="utf-8">
          <title>Calendrier basket</title>
          <p>Calendrier basket des enfants.</p>
          <p><a href="basket.ics">Calendrier ICS</a></p>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
